syntax = "proto3";

package recycling;

import "google/api/annotations.proto";

option go_package = "github.com/ecoscan/service/proto";

// RecyclingItem describes how to dispose of a single item.
message RecyclingItem {
  enum BinColour {
    BIN_COLOUR_UNKNOWN = 0;
    BLUE = 1;
    GREEN = 2;
    BROWN = 3;
    BLACK = 4;
  }

  enum BinType {
    BIN_TYPE_UNKNOWN = 0;
    PAPER = 1;
    RECYCLING = 2;
    GLASS = 3;
    WASTE = 4;
  }

  bool recyclable = 1;
  string advice = 2;
  BinColour bin_colour = 3;
  BinType bin_type = 4;
}

// CanItBeRecycled — barcode lookup
message CanItBeRecycledRequest {
  string barcode = 1;
  // council_id identifies the local authority. Defaults to "portsmouth" if empty.
  string council_id = 2;
}

message CanItBeRecycledResponse {
  RecyclingItem data = 1;
  string product_name = 2;
  string brand = 3;
}

// CanItBeRecycledSearch — text search
message CanItBeRecycledSearchRequest {
  string query = 1;
  string council_id = 2;
}

message CanItBeRecycledSearchResponse {
  repeated RecyclingItem data = 1;
}

// CanItBeRecycledImage — AI image classification
message CanItBeRecycledImageRequest {
  bytes image = 1;
  string council_id = 2;
}

message CanItBeRecycledImageResponse {
  RecyclingItem data = 1;
}

service RecyclingService {
  rpc CanItBeRecycled(CanItBeRecycledRequest) returns (CanItBeRecycledResponse) {
    option (google.api.http) = {
      post: "/v1/recycle/barcode"
      body: "*"
    };
  }

  rpc CanItBeRecycledSearch(CanItBeRecycledSearchRequest) returns (CanItBeRecycledSearchResponse) {
    option (google.api.http) = {
      get: "/v1/recycle/search"
    };
  }

  rpc CanItBeRecycledImage(CanItBeRecycledImageRequest) returns (CanItBeRecycledImageResponse) {
    option (google.api.http) = {
      post: "/v1/recycle/image"
      body: "*"
    };
  }
}
