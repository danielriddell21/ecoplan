syntax = "proto3";

package recycling.v1;

import "google/api/annotations.proto";

option go_package = "github.com/ecoscan/service/proto";

message RecyclingItem {
  enum BinColour {
    BIN_COLOUR_UNSPECIFIED = 0;
    BIN_COLOUR_BLUE = 1;
    BIN_COLOUR_GREEN = 2;
    BIN_COLOUR_BROWN = 3;
    BIN_COLOUR_BLACK = 4;
  }

  enum BinType {
    BIN_TYPE_UNSPECIFIED = 0;
    BIN_TYPE_PAPER = 1;
    BIN_TYPE_RECYCLING = 2;
    BIN_TYPE_GLASS = 3;
    BIN_TYPE_WASTE = 4;
  }

  bool recyclable = 1;
  string advice = 2;
  BinColour bin_colour = 3;
  BinType bin_type = 4;
}

message CanItBeRecycledBarcodeRequest {
  string barcode = 1;
  string council_id = 2;
}

message CanItBeRecycledBarcodeResponse {
  RecyclingItem data = 1;
  string product_name = 2;
  string brand = 3;
}

message CanItBeRecycledSearchRequest {
  string query = 1;
  string council_id = 2;
}

message CanItBeRecycledSearchResponse {
  repeated RecyclingItem data = 1;
}

message CanItBeRecycledImageRequest {
  bytes image = 1;
  string council_id = 2;
}

message CanItBeRecycledImageResponse {
  RecyclingItem data = 1;
}

service RecyclingService {
  rpc CanItBeRecycledBarcode(CanItBeRecycledBarcodeRequest) returns (CanItBeRecycledBarcodeResponse) {
    option (google.api.http) = {
      post: "/v1/recycle/barcode"
      body: "*"
    };
  }

  rpc CanItBeRecycledSearch(CanItBeRecycledSearchRequest) returns (CanItBeRecycledSearchResponse) {
    option (google.api.http) = {
      get: "/v1/recycle/search"
    };
  }

  rpc CanItBeRecycledImage(CanItBeRecycledImageRequest) returns (CanItBeRecycledImageResponse) {
    option (google.api.http) = {
      post: "/v1/recycle/image"
      body: "*"
    };
  }
}
