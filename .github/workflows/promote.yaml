name: Promote Release

on:
  release:
    types: [released]

jobs:
  retag:
    name: Retag image as latest
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest
        run: |
          VERSION=${{ github.event.release.tag_name }}
          docker pull ghcr.io/danielriddell21/ecoplan:${VERSION}
          docker tag  ghcr.io/danielriddell21/ecoplan:${VERSION} ghcr.io/danielriddell21/ecoplan:latest
          docker push ghcr.io/danielriddell21/ecoplan:latest

  update-manifests:
    name: Pin version in deploy/manifests
    needs: retag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: trunk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag
        run: |
          VERSION=${{ github.event.release.tag_name }}
          sed -i "s|image: ghcr.io/danielriddell21/ecoplan:.*|image: ghcr.io/danielriddell21/ecoplan:${VERSION}|g" \
            deploy/manifests/service/deployment.yaml

      - name: Commit and push
        run: |
          VERSION=${{ github.event.release.tag_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/manifests/service/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: deploy ${VERSION}"
          git push
