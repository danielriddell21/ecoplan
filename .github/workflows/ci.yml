name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go/service

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go/service/go.sum
            go.work.sum

      - name: Test
        run: go test ./go/service/... -race -count=1

  docker-service:
    name: Docker Build (service)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: go/service
          file: go/service/Dockerfile.service
          push: false
          tags: ecoplan/service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-gateway:
    name: Docker Build (gateway)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: go/service
          file: go/service/Dockerfile.gateway
          push: false
          tags: ecoplan/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push Images
    runs-on: ubuntu-latest
    needs: [docker-service, docker-gateway]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push service image
        uses: docker/build-push-action@v7
        with:
          context: go/service
          file: go/service/Dockerfile.service
          push: true
          tags: |
            ecoplan/service:${{ github.sha }}
            ecoplan/service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push gateway image
        uses: docker/build-push-action@v7
        with:
          context: go/service
          file: go/service/Dockerfile.gateway
          push: true
          tags: |
            ecoplan/gateway:${{ github.sha }}
            ecoplan/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
