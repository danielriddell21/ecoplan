name: CI

on:
  push:
    branches: ["trunk"]
    paths-ignore:
      - "**/*.md"
      - "bruno/**"
  pull_request:
    branches: ["trunk"]
    paths-ignore:
      - "**/*.md"
      - "bruno/**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go/service

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go/service/go.sum
            go.work.sum

      - name: Test
        run: go test ./go/service/... -race -count=1

  tag:
    name: Tag
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          # PAT required so the tag push triggers release.yaml — GITHUB_TOKEN pushes
          # don't fire downstream workflows.
          github_token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          default_bump: false
          tag_prefix: v
          release_branches: trunk
