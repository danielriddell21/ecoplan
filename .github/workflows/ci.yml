name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/service/go.mod
          cache-dependency-path: go/service/go.sum

      - name: Vet
        run: go vet ./go/service/...

      - name: Test
        run: go test ./go/service/... -race -count=1

  docker-service:
    name: Docker Build (service)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: go/service
          file: go/service/Dockerfile.service
          push: false
          tags: ecoplan/service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-gateway:
    name: Docker Build (gateway)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: go/service
          file: go/service/Dockerfile.gateway
          push: false
          tags: ecoplan/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
