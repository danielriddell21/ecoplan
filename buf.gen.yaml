version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: go/service
    opt:
      - paths=import
      - module=github.com/ecoscan/service
  - local: protoc-gen-go-grpc
    out: go/service
    opt:
      - paths=import
      - module=github.com/ecoscan/service
  - local: protoc-gen-grpc-gateway
    out: go/service
    opt:
      - paths=import
      - module=github.com/ecoscan/service
